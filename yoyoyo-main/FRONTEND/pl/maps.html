<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerLink Tracking</title>

  <style>
    #map {
      width: 100%;
      height: 500px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>Technician Live Tracking</h2>
  <div id="map"></div>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
    async defer>
  </script>

  <script>
    let map, userMarker, techMarker;

    function initMap() {
      // Default starting position (e.g. Hyderabad)
      const defaultLocation = { lat: 17.3850, lng: 78.4867 };

      map = new google.maps.Map(document.getElementById("map"), {
        center: defaultLocation,
        zoom: 13,
      });

      // Add dummy markers (you’ll update these dynamically later)
      userMarker = new google.maps.Marker({
        position: { lat: 17.3870, lng: 78.4800 },
        map,
        title: "Your Location",
        icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
      });

      techMarker = new google.maps.Marker({
        position: { lat: 17.3920, lng: 78.4900 },
        map,
        title: "Technician",
        icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
      });

      // Draw route between them
      drawRoute(userMarker.getPosition(), techMarker.getPosition());
    }

    function drawRoute(start, end) {
      const directionsService = new google.maps.DirectionsService();
      const directionsRenderer = new google.maps.DirectionsRenderer();
      directionsRenderer.setMap(map);

      directionsService.route({
        origin: start,
        destination: end,
        travelMode: google.maps.TravelMode.DRIVING,
      }, (result, status) => {
        if (status === "OK") {
          directionsRenderer.setDirections(result);
        } else {
          console.error("Directions request failed:", status);
        }
      });
    }
  </script>
</body>
</html>
