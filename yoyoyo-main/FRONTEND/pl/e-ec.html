<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLink E-Commerce - Electronics & Vehicle Services</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffcc00;
            --secondary: #1a202c;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --light: #f8fafc;
            --dark: #1e293b;
            --gray: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #e6b800 100%);
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--secondary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Search Section */
        .search-section {
            background: white;
            padding: 2rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .search-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .search-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .search-header p {
            font-size: 1.1rem;
            color: var(--gray);
        }

        .search-bar {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            padding-right: 4rem;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            color: var(--secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #e6b800;
            transform: translateY(-50%) scale(1.05);
        }

        /* Filter Section */
        .filter-section {
            background: white;
            padding: 1.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .filter-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-tabs {
            display: flex;
            gap: 1rem;
        }

        .filter-tab {
            padding: 0.75rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            background: white;
            color: var(--gray);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--secondary);
        }

        .filter-tab:hover {
            border-color: var(--primary);
        }

        .sort-dropdown {
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            color: var(--gray);
            font-weight: 500;
            cursor: pointer;
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .service-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .service-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .service-info {
            padding: 1.5rem;
        }

        .service-category {
            display: inline-block;
            background: var(--primary);
            color: var(--secondary);
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .service-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .service-description {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .service-features {
            list-style: none;
            margin-bottom: 1rem;
        }

        .service-features li {
            color: var(--gray);
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .service-features li i {
            color: var(--success);
            font-size: 0.7rem;
        }

        .service-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .service-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
        }

        .order-btn {
            background: var(--primary);
            color: var(--secondary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .order-btn:hover {
            background: #e6b800;
            transform: scale(1.05);
        }

        /* Category Sections */
        .category-section {
            margin-bottom: 3rem;
        }

        .category-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-title i {
            color: var(--primary);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .search-header h1 {
                font-size: 2rem;
            }

            .filter-container {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-tabs {
                justify-content: center;
            }

            .services-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1.5rem;
            }

            .main-content {
                padding: 1rem;
            }
        }

        /* Loading Animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Amazon-style Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: white;
            margin: 2% auto;
            padding: 0;
            border-radius: 12px;
            width: 95%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary) 0%, #e6b800 100%);
            padding: 1.5rem 2rem;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            color: var(--secondary);
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .close {
            color: var(--secondary);
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 2rem;
        }

        .service-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .service-image-container {
            text-align: center;
        }

        .service-main-image {
            width: 100%;
            max-width: 400px;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .service-info-details {
            padding: 1rem 0;
        }

        .service-price-large {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .service-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .stars {
            color: #fbbf24;
        }

        .rating-text {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .service-features-list {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        .service-features-list li {
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--dark);
        }

        .service-features-list li i {
            color: var(--success);
            font-size: 1rem;
        }

        .booking-form {
            background: #f8fafc;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .booking-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-book {
            flex: 1;
            background: var(--primary);
            color: var(--secondary);
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-book:hover {
            background: #e6b800;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
        }

        .btn-cancel {
            background: #6b7280;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #4b5563;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to { 
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Responsive Modal */
        @media (max-width: 768px) {
            .modal-content {
                width: 98%;
                margin: 1% auto;
                max-height: 95vh;
            }

            .service-details {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .booking-actions {
                flex-direction: column;
            }

            .modal-header {
                padding: 1rem;
            }

            .modal-body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">PowerLink</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="U.account/account.html"><i class="fas fa-user"></i> Account</a></li>
                    <li><a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a></li>
                    <li><a href="signup.html"><i class="fas fa-user-plus"></i> Signup</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-container">
            <div class="search-header">
                <h1><i class="fas fa-shopping-cart"></i> Service Marketplace</h1>
                <p>Find and book professional electronics and vehicle services</p>
            </div>
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search for services (e.g., AC repair, car service, laptop repair...)" id="searchInput">
                <button class="search-btn" onclick="searchServices()">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="filter-container">
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterServices('all')">All Services</button>
                <button class="filter-tab" onclick="filterServices('electronics')">Electronics</button>
                <button class="filter-tab" onclick="filterServices('vehicles')">Vehicles</button>
                <button class="filter-tab" onclick="filterServices('popular')">Popular</button>
            </div>
            <select class="sort-dropdown" onchange="sortServices(this.value)">
                <option value="name">Sort by Name</option>
                <option value="price">Sort by Price</option>
                <option value="rating">Sort by Rating</option>
            </select>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Electronics Section -->
        <section class="category-section" id="electronics-section">
            <h2 class="category-title">
                <i class="fas fa-microchip"></i> Electronics Services
            </h2>
            <div class="services-grid" id="electronics-grid">
                <!-- Electronics services will be populated here -->
            </div>
        </section>

        <!-- Vehicles Section -->
        <section class="category-section" id="vehicles-section">
            <h2 class="category-title">
                <i class="fas fa-car"></i> Vehicle Services
            </h2>
            <div class="services-grid" id="vehicles-grid">
                <!-- Vehicle services will be populated here -->
            </div>
        </section>
    </main>

    <!-- Amazon-style Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Service Details</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="modalContent">
                    <!-- Modal content will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Service data
        const services = {
            electronics: [
                {
                    id: 1,
                    name: "TV Repair & Installation",
                    image: "images/TV.html.png",
                    description: "Professional TV repair, installation, and maintenance services",
                    price: "₹800",
                    features: ["Same day service", "1 year warranty", "Free diagnosis"],
                    category: "electronics"
                },
                {
                    id: 2,
                    name: "Refrigerator Service",
                    image: "images/FRIDGE.webp",
                    description: "Complete fridge repair, maintenance, and gas refill services",
                    price: "₹1200",
                    features: ["Expert technicians", "Genuine parts", "24/7 support"],
                    category: "electronics"
                },
                {
                    id: 3,
                    name: "Laptop Repair",
                    image: "images/LAPTOP.webp",
                    description: "Laptop hardware repair, software issues, and upgrades",
                    price: "₹1500",
                    features: ["Data recovery", "Hardware upgrade", "Software installation"],
                    category: "electronics"
                },
                {
                    id: 4,
                    name: "AC Installation & Repair",
                    image: "images/AC.jpg",
                    description: "AC installation, repair, maintenance, and gas refill",
                    price: "₹2000",
                    features: ["Free installation", "6 months warranty", "Energy efficient"],
                    category: "electronics"
                },
                {
                    id: 5,
                    name: "Washing Machine Service",
                    image: " ",
                    description: "Washing machine repair, maintenance, and installation",
                    price: "₹1000",
                    features: ["Water leak repair", "Motor service", "Drum cleaning"],
                    category: "electronics"
                },
                {
                    id: 6,
                    name: "Microwave Repair",
                    image: "images/electronics6.jpg",
                    description: "Microwave oven repair and maintenance services",
                    price: "₹600",
                    features: ["Quick repair", "Safety check", "Warranty included"],
                    category: "electronics"
                },
                {
                    id: 7,
                    name: "Camera Repair",
                    image: "images/electronics7.jpg",
                    description: "Digital camera and DSLR repair services",
                    price: "₹1800",
                    features: ["Lens repair", "Sensor cleaning", "Software update"],
                    category: "electronics"
                },
                {
                    id: 8,
                    name: "Speaker System Setup",
                    image: "images/electronics8.jpg",
                    description: "Home theater and speaker system installation",
                    price: "₹2500",
                    features: ["Professional setup", "Sound calibration", "Wire management"],
                    category: "electronics"
                }
                
            ],
            vehicles: [
                {
                    id: 9,
                    name: "Bike Service",
                    image: "images/electronics1.jpg",
                    description: "Complete bike service, repair, and maintenance",
                    price: "₹800",
                    features: ["Engine service", "Brake check", "Oil change"],
                    category: "vehicles"
                },
                {
                    id: 10,
                    name: "Car Service",
                    image: "images/electronics2.jpg",
                    description: "Comprehensive car service and maintenance",
                    price: "₹2500",
                    features: ["Full inspection", "Engine tune-up", "AC service"],
                    category: "vehicles"
                },
                {
                    id: 11,
                    name: "Bus Maintenance",
                    image: "images/electronics3.jpg",
                    description: "Commercial bus service and maintenance",
                    price: "₹5000",
                    features: ["Fleet service", "Safety check", "Documentation"],
                    category: "vehicles"
                },
                {
                    id: 12,
                    name: "Auto Rickshaw Service",
                    image: "images/electronics4.jpg",
                    description: "Auto rickshaw repair and maintenance",
                    price: "₹600",
                    features: ["Engine repair", "Body work", "Electrical fix"],
                    category: "vehicles"
                },
                {
                    id: 13,
                    name: "Scooter Service",
                    image: "images/electronics6.jpg",
                    description: "Scooter repair, service, and maintenance",
                    price: "₹700",
                    features: ["Gear service", "Battery check", "Tire change"],
                    category: "vehicles"
                },
                {
                    id: 14,
                    name: "Truck Service",
                    image: "images/electronics7.jpg",
                    description: "Heavy vehicle truck service and repair",
                    price: "₹4000",
                    features: ["Engine overhaul", "Transmission", "Brake system"],
                    category: "vehicles"
                }
            ]
        };

        let currentFilter = 'all';
        let currentSort = 'name';

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            renderServices();
            setupSearch();
        });

        // Render services based on current filter
        function renderServices() {
            const electronicsGrid = document.getElementById('electronics-grid');
            const vehiclesGrid = document.getElementById('vehicles-grid');
            
            electronicsGrid.innerHTML = '';
            vehiclesGrid.innerHTML = '';

            let electronicsToShow = services.electronics;
            let vehiclesToShow = services.vehicles;

            // Apply filter
            if (currentFilter === 'popular') {
                electronicsToShow = services.electronics.slice(0, 4);
                vehiclesToShow = services.vehicles.slice(0, 4);
            }

            // Apply sorting
            electronicsToShow = sortServicesArray(electronicsToShow);
            vehiclesToShow = sortServicesArray(vehiclesToShow);

            // Render electronics
            electronicsToShow.forEach(service => {
                electronicsGrid.appendChild(createServiceCard(service));
            });

            // Render vehicles
            vehiclesToShow.forEach(service => {
                vehiclesGrid.appendChild(createServiceCard(service));
            });
        }

        // Create service card element
        function createServiceCard(service) {
            const card = document.createElement('div');
            card.className = 'service-card';
            card.onclick = () => openOrderModal(service);
            
            card.innerHTML = `
                <img src="${service.image}" alt="${service.name}" class="service-image" onerror="this.src='https://via.placeholder.com/280x200/f1f5f9/64748b?text=${encodeURIComponent(service.name)}'">
                <div class="service-info">
                    <span class="service-category">${service.category.toUpperCase()}</span>
                    <h3 class="service-name">${service.name}</h3>
                    <p class="service-description">${service.description}</p>
                    <ul class="service-features">
                        ${service.features.map(feature => `<li><i class="fas fa-check"></i> ${feature}</li>`).join('')}
                    </ul>
                    <div class="service-footer">
                        <span class="service-price">${service.price}</span>
                        <button class="order-btn" onclick="event.stopPropagation(); openOrderModal(${service.id})">
                            <i class="fas fa-shopping-cart"></i> Book Now
                        </button>
                    </div>
                </div>
            `;
            
            return card;
        }

        // Filter services
        function filterServices(filter) {
            currentFilter = filter;
            
            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderServices();
        }

        // Sort services
        function sortServices(sortBy) {
            currentSort = sortBy;
            renderServices();
        }

        // Sort services array
        function sortServicesArray(servicesArray) {
            return servicesArray.sort((a, b) => {
                switch(currentSort) {
                    case 'price':
                        return parseInt(a.price.replace('₹', '')) - parseInt(b.price.replace('₹', ''));
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'rating':
                        return Math.random() - 0.5; // Mock rating sort
                    default:
                        return 0;
                }
            });
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchServices();
                }
            });
        }

        function searchServices() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (!searchTerm) {
                renderServices();
                return;
            }

            const allServices = [...services.electronics, ...services.vehicles];
            const filteredServices = allServices.filter(service => 
                service.name.toLowerCase().includes(searchTerm) ||
                service.description.toLowerCase().includes(searchTerm) ||
                service.category.toLowerCase().includes(searchTerm)
            );

            // Clear existing grids
            document.getElementById('electronics-grid').innerHTML = '';
            document.getElementById('vehicles-grid').innerHTML = '';

            if (filteredServices.length === 0) {
                document.getElementById('electronics-grid').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--gray);">
                        <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <h3>No services found</h3>
                        <p>Try searching with different keywords</p>
                    </div>
                `;
                return;
            }

            // Group filtered services by category
            const electronics = filteredServices.filter(s => s.category === 'electronics');
            const vehicles = filteredServices.filter(s => s.category === 'vehicles');

            // Render filtered results
            electronics.forEach(service => {
                document.getElementById('electronics-grid').appendChild(createServiceCard(service));
            });

            vehicles.forEach(service => {
                document.getElementById('vehicles-grid').appendChild(createServiceCard(service));
            });
        }

        // Open Amazon-style order modal
        function openOrderModal(service) {
            const modal = document.getElementById('orderModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            
            // Find service by ID if number is passed
            const serviceData = typeof service === 'number' 
                ? [...services.electronics, ...services.vehicles].find(s => s.id === service)
                : service;
            
            modalTitle.textContent = serviceData.name;
            modalContent.innerHTML = `
                <div class="service-details">
                    <div class="service-image-container">
                        <img src="${serviceData.image}" alt="${serviceData.name}" class="service-main-image" onerror="this.src='https://via.placeholder.com/400x300/f1f5f9/64748b?text=${encodeURIComponent(serviceData.name)}'">
                    </div>
                    <div class="service-info-details">
                        <div class="service-price-large">${serviceData.price}</div>
                        <div class="service-rating">
                            <div class="stars">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                            </div>
                            <span class="rating-text">(4.8) Based on 127 reviews</span>
                        </div>
                        <p style="color: var(--gray); margin-bottom: 1.5rem; line-height: 1.6;">${serviceData.description}</p>
                        <ul class="service-features-list">
                            ${serviceData.features.map(feature => `<li><i class="fas fa-check"></i> ${feature}</li>`).join('')}
                        </ul>
                    </div>
                </div>
                
                <div class="booking-form">
                    <h3 style="color: var(--secondary); margin-bottom: 1.5rem; font-size: 1.3rem;">
                        <i class="fas fa-calendar-check"></i> Book This Service
                    </h3>
                    <form id="orderForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Your Name</label>
                                <input type="text" required placeholder="Enter your full name">
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" required placeholder="+91 98765 43210">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Service Address</label>
                            <textarea required placeholder="Enter your complete address where service is needed"></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Preferred Date</label>
                                <input type="date" required>
                            </div>
                            <div class="form-group">
                                <label>Preferred Time</label>
                                <select required>
                                    <option value="">Select time slot</option>
                                    <option value="9-12">9:00 AM - 12:00 PM</option>
                                    <option value="12-3">12:00 PM - 3:00 PM</option>
                                    <option value="3-6">3:00 PM - 6:00 PM</option>
                                    <option value="6-9">6:00 PM - 9:00 PM</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Additional Notes</label>
                            <textarea placeholder="Any specific requirements, issues, or additional information..."></textarea>
                        </div>
                        <div class="booking-actions">
                            <button type="submit" class="btn-book">
                                <i class="fas fa-shopping-cart"></i> Book Now - ${serviceData.price}
                            </button>
                            <button type="button" class="btn-cancel" onclick="closeModal()">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                        </div>
                    </form>
                </div>
            `;
            
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
            
            // Handle form submission
            document.getElementById('orderForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Show success message
                const successMessage = document.createElement('div');
                successMessage.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: var(--success);
                    color: white;
                    padding: 2rem;
                    border-radius: 12px;
                    text-align: center;
                    z-index: 3000;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                `;
                successMessage.innerHTML = `
                    <i class="fas fa-check-circle" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                    <h3 style="margin-bottom: 0.5rem;">Booking Confirmed!</h3>
                    <p>Our technician will contact you soon to confirm the appointment.</p>
                `;
                
                document.body.appendChild(successMessage);
                
                setTimeout(() => {
                    document.body.removeChild(successMessage);
                    closeModal();
                }, 3000);
            });
        }

        // Close modal
        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Restore background scrolling
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('orderModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
