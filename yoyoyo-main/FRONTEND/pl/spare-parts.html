<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLink - Spare Parts Marketplace</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffcc00;
            --secondary: #1a202c;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --light: #f8fafc;
            --dark: #1e293b;
            --gray: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #e6b800 100%);
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--secondary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Search Section */
        .search-section {
            background: white;
            padding: 2rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .search-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .search-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .search-header p {
            font-size: 1.1rem;
            color: var(--gray);
        }

        .search-bar {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            padding-right: 4rem;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            color: var(--secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #e6b800;
            transform: translateY(-50%) scale(1.05);
        }

        /* Filter Section */
        .filter-section {
            background: white;
            padding: 1.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .filter-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-tabs {
            display: flex;
            gap: 1rem;
        }

        .filter-tab {
            padding: 0.75rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            background: white;
            color: var(--gray);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--secondary);
        }

        .filter-tab:hover {
            border-color: var(--primary);
        }

        .sort-dropdown {
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            color: var(--gray);
            font-weight: 500;
            cursor: pointer;
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .parts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .part-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .part-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .part-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .part-info {
            padding: 1.5rem;
        }

        .part-category {
            display: inline-block;
            background: var(--primary);
            color: var(--secondary);
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .part-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .part-description {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .part-compatibility {
            list-style: none;
            margin-bottom: 1rem;
        }

        .part-compatibility li {
            color: var(--gray);
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .part-compatibility li i {
            color: var(--success);
            font-size: 0.7rem;
        }

        .part-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .part-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
        }

        .cart-btn {
            background: var(--primary);
            color: var(--secondary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cart-btn:hover {
            background: #e6b800;
            transform: scale(1.05);
        }

        /* Category Sections */
        .category-section {
            margin-bottom: 3rem;
        }

        .category-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-title i {
            color: var(--primary);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .search-header h1 {
                font-size: 2rem;
            }

            .filter-container {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-tabs {
                justify-content: center;
            }

            .parts-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1.5rem;
            }

            .main-content {
                padding: 1rem;
            }
        }

        /* Loading Animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: white;
            margin: 2% auto;
            padding: 0;
            border-radius: 12px;
            width: 95%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary) 0%, #e6b800 100%);
            padding: 1.5rem 2rem;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            color: var(--secondary);
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .close {
            color: var(--secondary);
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 2rem;
        }

        .part-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .part-image-container {
            text-align: center;
        }

        .part-main-image {
            width: 100%;
            max-width: 400px;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .part-info-details {
            padding: 1rem 0;
        }

        .part-price-large {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .part-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .stars {
            color: #fbbf24;
        }

        .rating-text {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .part-compatibility-list {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        .part-compatibility-list li {
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--dark);
        }

        .part-compatibility-list li i {
            color: var(--success);
            font-size: 1rem;
        }

        .purchase-form {
            background: #f8fafc;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .purchase-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-purchase {
            flex: 1;
            background: var(--primary);
            color: var(--secondary);
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-purchase:hover {
            background: #e6b800;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
        }

        .btn-cancel {
            background: #6b7280;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #4b5563;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to { 
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Responsive Modal */
        @media (max-width: 768px) {
            .modal-content {
                width: 98%;
                margin: 1% auto;
                max-height: 95vh;
            }

            .part-details {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .purchase-actions {
                flex-direction: column;
            }

            .modal-header {
                padding: 1rem;
            }

            .modal-body {
                padding: 1rem;
            }
        }
    </style>
</head>

            </div>
        </section>

        <!-- Vehicle Parts Section -->

            <h2 class="category-title">
                <i class="fas fa-car"></i> Vehicle Spare Parts
            </h2>
            <div class="parts-grid" id="vehicles-grid">
                <!-- Vehicle parts will be populated here -->
            </div>
        </section>
    </main>

            </div>
            <div class="modal-body">
                <div id="modalContent">
                    <!-- Modal content will be populated here -->
                </div>
            </div>
        </div>
    </div>

        let currentFilter = 'all';
        let currentSort = 'name';

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Check if a brand parameter exists in the URL
            if (brandParam) {
                // Update page title and description
                document.querySelector('.search-header h1').textContent = brandParam + " Spare Parts";
                document.querySelector('.search-header p').textContent = "Browse all spare parts for " + brandParam + " products";
                
                // Filter and display only parts from the selected brand
                showBrandParts(brandParam);
            } else {
                // Show all parts if no brand is specified
                renderParts();
            }
            setupSearch();
        });

        // Show parts for a specific brand
        function showBrandParts(brandName) {
            const electronicsGrid = document.getElementById('electronics-grid');
            const vehiclesGrid = document.getElementById('vehicles-grid');
            
            electronicsGrid.innerHTML = '';
            vehiclesGrid.innerHTML = '';
            
            // Filter parts by brand
            const brandElectronics = parts.electronics.filter(part => part.brand === brandName);
            const brandVehicles = parts.vehicles.filter(part => part.brand === brandName);
            
            // Hide sections if no parts
            document.getElementById('electronics-section').style.display = brandElectronics.length > 0 ? 'block' : 'none';
            document.getElementById('vehicles-section').style.display = brandVehicles.length > 0 ? 'block' : 'none';
            
            // Update section titles
            if (brandElectronics.length > 0) {
                document.querySelector('#electronics-section .category-title').innerHTML = 
                    `<i class="fas fa-microchip"></i> ${brandName} Electronics Spare Parts`;
            }
            
            if (brandVehicles.length > 0) {
                document.querySelector('#vehicles-section .category-title').innerHTML = 
                    `<i class="fas fa-car"></i> ${brandName} Vehicle Spare Parts`;
            }
            
            // Render filtered parts
            brandElectronics.forEach(part => {
                electronicsGrid.appendChild(createPartCard(part));
            });
            
            brandVehicles.forEach(part => {
                vehiclesGrid.appendChild(createPartCard(part));
            });
            
            // Show no parts message if needed
            if (brandElectronics.length === 0 && brandVehicles.length === 0) {
                electronicsGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--gray);">
                        <i class="fas fa-box-open" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <h3>No spare parts found for ${brandName}</h3>
                        <p>Try searching for a different brand</p>
                    </div>
                `;
                document.getElementById('electronics-section').style.display = 'block';
            }
        }

        // Render parts based on current filter
        function renderParts() {
            const electronicsGrid = document.getElementById('electronics-grid');
            const vehiclesGrid = document.getElementById('vehicles-grid');
            
            electronicsGrid.innerHTML = '';
            vehiclesGrid.innerHTML = '';

            let electronicsToShow = parts.electronics;
            let vehiclesToShow = parts.vehicles;

            // Apply filter
            if (currentFilter === 'popular') {
                electronicsToShow = parts.electronics.slice(0, 4);
                vehiclesToShow = parts.vehicles.slice(0, 4);
            }

            // Apply sorting
            electronicsToShow = sortPartsArray(electronicsToShow);
            vehiclesToShow = sortPartsArray(vehiclesToShow);

            // Render electronics
            electronicsToShow.forEach(part => {
                electronicsGrid.appendChild(createPartCard(part));
            });

            // Render vehicles
            vehiclesToShow.forEach(part => {
                vehiclesGrid.appendChild(createPartCard(part));
            });
        }

        // Create part card element
        function createPartCard(part) {
            const card = document.createElement('div');
            card.className = 'part-card';
            card.onclick = () => openPartModal(part);
            
            // Generate compatibility list items
            const compatibilityItems = part.compatibility.map(item => 
                `<li><i class="fas fa-check"></i> ${item}</li>`
            ).join('');
            
            card.innerHTML = `
                <img src="${part.image}" alt="${part.name}" class="part-image" onerror="this.src='https://via.placeholder.com/280x200/f1f5f9/64748b?text=${encodeURIComponent(part.name)}'">
                <div class="part-info">
                    <span class="part-category">${part.subcategory.toUpperCase()}</span>
                    <h3 class="part-name">${part.name}</h3>
                    <p class="part-description">${part.description}</p>
                    <ul class="part-compatibility">
                        ${compatibilityItems}
                    </ul>
                    <div class="part-footer">
                        <span class="part-price">₹${(part.price * 75).toFixed(2)}</span>
                        <button class="cart-btn" onclick="event.stopPropagation(); addToCart(${part.id})">
                            <i class="fas fa-shopping-cart"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `;
            
            return card;
        }

        // Filter parts
        function filterParts(filter) {
            currentFilter = filter;
            
            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Show/hide sections based on filter
            if (filter === 'electronics') {
                document.getElementById('electronics-section').style.display = 'block';
                document.getElementById('vehicles-section').style.display = 'none';
            } else if (filter === 'vehicles') {
                document.getElementById('electronics-section').style.display = 'none';
                document.getElementById('vehicles-section').style.display = 'block';
            } else {
                document.getElementById('electronics-section').style.display = 'block';
                document.getElementById('vehicles-section').style.display = 'block';
            }
            
            renderParts();
        }

        // Sort parts
        function sortParts(sortBy) {
            currentSort = sortBy;
            renderParts();
        }

        // Sort parts array
        function sortPartsArray(partsArray) {
            return partsArray.sort((a, b) => {
                switch(currentSort) {
                    case 'price':
                        return a.price - b.price;
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'rating':
                        return Math.random() - 0.5; // Mock rating sort
                    default:
                        return 0;
                }
            });
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchParts();
                }
            });
        }

        function searchParts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (!searchTerm) {
                renderParts();
                return;
            }

            const allParts = [...parts.electronics, ...parts.vehicles];
            const filteredParts = allParts.filter(part => 
                part.name.toLowerCase().includes(searchTerm) ||
                part.description.toLowerCase().includes(searchTerm) ||
                part.subcategory.toLowerCase().includes(searchTerm) ||
                part.brand.toLowerCase().includes(searchTerm) ||
                part.compatibility.some(item => item.toLowerCase().includes(searchTerm))
            );

            // Clear existing grids
            document.getElementById('electronics-grid').innerHTML = '';
            document.getElementById('vehicles-grid').innerHTML = '';

            if (filteredParts.length === 0) {
                document.getElementById('electronics-grid').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--gray);">
                        <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <h3>No spare parts found</h3>
                        <p>Try searching with different keywords</p>
                    </div>
                `;
                document.getElementById('vehicles-section').style.display = 'none';
                return;
            }

            // Group filtered parts by category
            const electronics = filteredParts.filter(p => p.category === 'electronics');
            const vehicles = filteredParts.filter(p => p.category === 'vehicles');

            // Show/hide sections based on results
            document.getElementById('electronics-section').style.display = electronics.length > 0 ? 'block' : 'none';
            document.getElementById('vehicles-section').style.display = vehicles.length > 0 ? 'block' : 'none';

            // Render filtered results
            electronics.forEach(part => {
                document.getElementById('electronics-grid').appendChild(createPartCard(part));
            });

            vehicles.forEach(part => {
                document.getElementById('vehicles-grid').appendChild(createPartCard(part));
            });
        }

        // Open part detail modal
        function openPartModal(part) {
            const modal = document.getElementById('partModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            
            // Find part by ID if number is passed
            const partData = typeof part === 'number' 
                ? [...parts.electronics, ...parts.vehicles].find(p => p.id === part)
                : part;
            
            modalTitle.textContent = partData.name;
            
            // Generate compatibility list items for modal
            const compatibilityItems = partData.compatibility.map(item => 
                `<li><i class="fas fa-check"></i> ${item}</li>`
            ).join('');
            
            modalContent.innerHTML = `
                <div class="part-details">
                    <div class="part-image-container">
                        <img src="${partData.image}" alt="${partData.name}" class="part-main-image" onerror="this.src='https://via.placeholder.com/400x300/f1f5f9/64748b?text=${encodeURIComponent(partData.name)}'">
                    </div>
                    <div class="part-info-details">
                        <div class="part-price-large">₹${(partData.price * 75).toFixed(2)}</div>
                        <div class="part-rating">
                            <div class="stars">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star-half-alt"></i>
                            </div>
                            <span class="rating-text">(4.5) Based on 87 reviews</span>
                        </div>
                        <p style="color: var(--gray); margin-bottom: 1.5rem; line-height: 1.6;">${partData.description}</p>
                        <div style="margin-bottom: 1rem;">
                            <strong>Brand:</strong> ${partData.brand}<br>
                            <strong>Category:</strong> ${partData.category} / ${partData.subcategory}
                        </div>
                        <h4 style="margin-bottom: 0.5rem;">Compatible With:</h4>
                        <ul class="part-compatibility-list">
                            ${compatibilityItems}
                        </ul>
                    </div>
                </div>
                
                <div class="purchase-form">
                    <h3 style="color: var(--secondary); margin-bottom: 1.5rem; font-size: 1.3rem;">
                        <i class="fas fa-shopping-cart"></i> Purchase This Part
                    </h3>
                    <form id="purchaseForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Quantity</label>
                                <input type="number" min="1" value="1" required>
                            </div>
                            <div class="form-group">
                                <label>Delivery Option</label>
                                <select required>
                                    <option value="">Select delivery option</option>
                                    <option value="standard">Standard Delivery (3-5 days) - $5.99</option>
                                    <option value="express">Express Delivery (1-2 days) - $12.99</option>
                                    <option value="pickup">Store Pickup (Free)</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Special Instructions (Optional)</label>
                            <textarea placeholder="Any specific requirements or notes..."></textarea>
                        </div>
                        <div class="purchase-actions">
                            <button type="submit" class="btn-purchase">
                                <i class="fas fa-shopping-cart"></i> Add to Cart - $${partData.price.toFixed(2)}
                            </button>
                            <button type="button" class="btn-cancel" onclick="closeModal()">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                        </div>
                    </form>
                </div>
            `;
            
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
            
            // Handle form submission
            document.getElementById('purchaseForm').addEventListener('submit', function(e) {
                e.preventDefault();
                addToCart(partData.id, true);
            });
        }

        // Add to cart function
        function addToCart(partId, fromModal = false) {
            // Find the part
            const part = [...parts.electronics, ...parts.vehicles].find(p => p.id === partId);
            
            // Show success message
            const successMessage = document.createElement('div');
            successMessage.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: var(--success);
                color: white;
                padding: 2rem;
                border-radius: 12px;
                text-align: center;
                z-index: 3000;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            successMessage.innerHTML = `
                <i class="fas fa-check-circle" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                <h3 style="margin-bottom: 0.5rem;">${part.name} Added to Cart!</h3>
                <p>You can continue shopping or proceed to checkout.</p>
            `;
            
            document.body.appendChild(successMessage);
            
            setTimeout(() => {
                document.body.removeChild(successMessage);
                if (fromModal) {
                    closeModal();
                }
            }, 2000);
        }

        // Close modal
        function closeModal() {
            document.getElementById('partModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Restore background scrolling
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('partModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
